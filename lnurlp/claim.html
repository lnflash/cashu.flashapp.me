<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Flash Address Claim</title>
<style>
:root{--bg:#0a0a0a;--surface:#111114;--surface-raised:#1a1a1e;--border:rgba(255,255,255,0.08);--primary:#41ad49;--primary-dim:rgba(65,173,73,0.12);--primary-glow:rgba(65,173,73,0.3);--text:#f5f5f5;--text-muted:#888;--radius-card:16px;--radius-input:12px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:40px 32px;width:100%;max-width:440px;box-shadow:0 24px 48px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:8px;font-size:2.5rem}
.title{text-align:center;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.subtitle{text-align:center;color:var(--text-muted);font-size:.875rem;margin-bottom:32px;line-height:1.5}
.subtitle span{color:var(--primary);font-weight:500}
label{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:6px}
.input-group{display:flex;align-items:center;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-input);overflow:hidden;transition:border-color .2s}
.input-group:focus-within{border-color:var(--primary-glow)}
.input-group input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:1rem;padding:14px 16px}
.input-group input::placeholder{color:var(--text-muted)}
.input-suffix{padding-right:14px;color:var(--text-muted);font-size:.875rem;white-space:nowrap}
.form-group{margin-bottom:20px}
.status{font-size:.8rem;margin-top:6px;min-height:18px}
.status.ok{color:var(--primary)}.status.err{color:#f87171}
.btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-input);font-family:var(--font);font-size:1rem;font-weight:600;padding:15px;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:8px}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}
.pending-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px;margin-bottom:20px;display:none}
.pending-amount{font-size:1.8rem;font-weight:700;color:var(--primary);text-align:center;margin:8px 0}
.pending-label{text-align:center;color:var(--text-muted);font-size:.875rem}
.success-card{background:var(--primary-dim);border:1px solid var(--primary-glow);border-radius:var(--radius-card);padding:24px;text-align:center;display:none}
.empty-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-card);padding:24px;text-align:center;display:none;color:var(--text-muted)}
.footer{text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:24px}
.footer a{color:var(--primary);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">&#x26A1;</div>
  <div class="title">Claim ecash</div>
  <div class="subtitle">Check for pending payments at your <span>Flash Address</span></div>
  <div id="lookupSection">
    <div class="form-group"><label for="username">Your username</label><div class="input-group"><input id="username" type="text" placeholder="satoshi" autocomplete="off" autocapitalize="none" spellcheck="false"/><span class="input-suffix">@ecash.flashapp.me</span></div></div>
    <button id="checkBtn" class="btn">Check for payments</button>
    <div id="checkStatus" class="status" style="margin-top:12px"></div>
  </div>
  <div class="pending-card" id="pendingCard">
    <div class="pending-label">Pending payment</div>
    <div class="pending-amount" id="pendingAmount">-- sats</div>
    <div class="pending-label" id="pendingMint"></div>
    <button class="btn" id="claimBtn" style="margin-top:16px">Open in Flash Wallet</button>
  </div>
  <div class="empty-card" id="emptyCard"><div style="font-size:1.5rem;margin-bottom:8px">&#x1F4EB;</div><div>No pending payments found.</div><div style="font-size:.75rem;margin-top:4px">Payments arrive shortly after being sent.</div></div>
  <div class="success-card" id="successCard"><div style="font-size:2rem">&#x2705;</div><div style="font-weight:600;margin-top:8px">Redirecting to wallet&#x2026;</div><div style="color:var(--text-muted);font-size:.875rem;margin-top:4px">Opening Flash Ecash to redeem your tokens.</div></div>
  <div class="footer">Powered by <a href="https://ecash.flashapp.me">Flash Ecash</a></div>
</div>
<script>
const API="https://ecash.flashapp.me",WALLET="https://ecash.flashapp.me";
const u=document.getElementById("username"),cb=document.getElementById("checkBtn"),cs=document.getElementById("checkStatus"),pc=document.getElementById("pendingCard"),pa=document.getElementById("pendingAmount"),pm=document.getElementById("pendingMint"),clb=document.getElementById("claimBtn"),ec=document.getElementById("emptyCard"),sc=document.getElementById("successCard");
const params=new URLSearchParams(location.search);if(params.get("u"))u.value=params.get("u");
cb.addEventListener("click",async()=>{const un=u.value.trim().toLowerCase();if(!un){cs.textContent="Enter your username first";cs.className="status err";return;}cb.disabled=true;cs.textContent="Checking…";cs.className="status";pc.style.display="none";ec.style.display="none";
try{const r=await fetch(API+"/api/claim/"+un);if(!r.ok)throw new Error("not found");const d=await r.json();if(!d.token||d.balance===0){ec.style.display="block";cs.textContent="";}else{pa.textContent=d.balance+" sats";pm.textContent=d.mint?"from "+d.mint:"";pc.style.display="block";cs.textContent="";clb.onclick=()=>{sc.style.display="block";pc.style.display="none";setTimeout(()=>{window.location.href=WALLET+"/?token="+encodeURIComponent(d.token);},800);}}}catch{cs.textContent="No account found for that username.";cs.className="status err";}cb.disabled=false;});
</script>
</body>
</html>
